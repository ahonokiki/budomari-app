<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アイテム宣伝画像メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@900&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@900&family=Kiwi+Maru:wght@500&family=Dela+Gothic+One&family=Hachi+Maru+Pop&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:16px;font-family:sans-serif;background:#fff5f8;color:#333;max-width:600px}
  h1{font-size:18px;margin:0 0 12px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
  label{font-size:14px}
  input[type=number]{width:70px}
  canvas{width:100%;border-radius:8px;box-shadow:0 2px 10px #0002;display:block;margin-top:12px}
  button{background:#ff4fa3;color:#fff;border:0;border-radius:20px;padding:10px 18px;font-size:15px}
  fieldset{border:1px solid #f3c;border-radius:8px;margin:8px 0;font-size:13px}
  .sw{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2px solid #eee;border-radius:10px;padding:4px 6px;font-size:11px;color:#333;cursor:pointer}
  .sw.on{border-color:#ff4fa3}
  .sw i{width:34px;height:34px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .set{position:relative;width:64px;height:64px;border-radius:12px;border:3px solid #eee;background-size:cover;background-position:center;cursor:pointer;padding:0}
  .set.on{border-color:#ff4fa3}
  .set b{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;border:2px solid #fff}
  .set .del{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:#999;color:#fff;font-size:12px;line-height:20px;text-align:center}
  .addbtn{background:#fff;border:2px dashed #ff9ad5;border-radius:12px;padding:8px 12px;cursor:pointer;color:#ff4fa3}
  .note{font-size:12px;color:#666}
</style>
</head>
<body>
<h1>アイテム宣伝画像メーカー</h1>
<fieldset><legend>背景セット（背景＋フチ色）</legend>
  <div class="row" id="sets"></div>
  <div class="row"><label class="addbtn">＋ 新しい背景を追加<input type="file" id="bg" accept="image/*" hidden></label></div>
  <div class="note">背景ごとにフチ色をセットで保存します。セットを選ぶと、その背景とフチ色がそのまま使われます。</div>
</fieldset>
<div class="row"><label>アイテムのスクショ <input type="file" id="shot" accept="image/*"></label></div>
<div class="note">スクショは貼り付け(Ctrl+V)・ドラッグ&ドロップでもOK。</div>

<fieldset><legend>×数字</legend>
  <div class="row">
    <label>所持数 <input type="number" id="owned" value="4" min="1"></label>
    <label><input type="checkbox" id="manual">手動で指定</label>
    <label>× <input type="number" id="count" value="3" min="0" disabled></label>
    <label><input type="checkbox" id="showCount" checked>表示</label>
  </div>
  <div class="row"><label>書体
    <select id="font">
      <option value="B" selected>B: もちもち（Mochiy Pop One）※見本に近い</option>
      <option value="A">A: まるっとポップ（M PLUS Rounded 極太）</option>
      <option value="C">C: やさしい丸（Zen Maru Gothic 極太）</option>
      <option value="D">D: ぽってり（Dela Gothic One）</option>
      <option value="E">E: 手書き風（Hachi Maru Pop）</option>
      <option value="F">F: ふんわり（Kiwi Maru）</option>
    </select></label></div>
  <div class="note">×の数は「所持数−1」で自動計算。変えたいときは「手動で指定」。</div>
</fieldset>

<fieldset><legend>フチの色（選んでいるセットに保存）</legend>
  <div class="row" id="swatches"></div>
  <div class="row"><label>自由に指定 <input type="color" id="edgeColor" value="#ec5fd0"></label></div>
  <div class="note">「おすすめ」は背景から浮き上がる同系色のネオンカラーです。</div>
</fieldset>

<fieldset><legend>切り抜き（スクショ幅を100とした値・正方形）</legend>
  <div class="row">
    <label>上端 <input type="number" id="ct" value="54" step="0.5"></label>
    <label>一辺 <input type="number" id="cs" value="100" step="0.5" max="100"></label>
  </div>
  <div class="note">標準はアイテムの上〜「所持数」の行まで。左右は自動で中央。元画像のピクセルを切り抜いて縦横同倍率で拡大するだけで、描き直し・補正はしません。</div>
</fieldset>

<canvas id="cv" width="1254" height="1254"></canvas>
<div class="row" style="margin-top:12px"><button id="dl">画像を保存</button></div>

<script>
const S = 1254;
// アイテム画像の位置・サイズは常に固定（正方形）
const BOX = {x:127, y:128, size:1000};
const R = 44;        // 四隅の丸み（アイテム画像とフチで共通）
const EDGE_IN = 6, EDGE_CORE = 8; // フチ：内側ピンク6px＋白い芯8px＋外側の光（常に同じ太さ）
const FONTS = {
  A:'900 290px "M PLUS Rounded 1c"',
  B:'272px "Mochiy Pop One"',
  C:'900 300px "Zen Maru Gothic"',
  D:'280px "Dela Gothic One"',
  E:'310px "Hachi Maru Pop"',
  F:'500 300px "Kiwi Maru"',
};
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let bgImg = null, shotImg = null;

const store = {get:k=>{try{return localStorage.getItem('promo_'+k)}catch(e){return null}},
               set:(k,v)=>{try{localStorage.setItem('promo_'+k,v)}catch(e){}}};

// 設定の記憶
['owned','count','ct','cs','font'].forEach(id=>{
  const v = store.get(id); if (v!==null) $(id).value = v;
  $(id).addEventListener('input',()=>{ store.set(id,$(id).value); draw(); });
});
if (store.get('manual')==='1') $('manual').checked = true;
$('manual').addEventListener('change',()=>{ store.set('manual',$('manual').checked?'1':'0'); draw(); });
$('showCount').addEventListener('change',draw);

function fromFile(f, cb){ const i=new Image(); i.onload=()=>{cb(i);draw();}; i.src=URL.createObjectURL(f); }
$('shot').addEventListener('change',()=>{ const f=$('shot').files[0]; if(f) fromFile(f,i=>shotImg=i); });

// ---- 背景セット（背景画像＋フチ色を1セットで保存） ----
let sets = []; try{ sets = JSON.parse(store.get('sets')||'[]'); }catch(e){}
let cur = store.get('curSet');
const saveSets = () => { try{ localStorage.setItem('promo_sets', JSON.stringify(sets)); }catch(e){ alert('保存容量がいっぱいです。使わないセットを削除してください。'); } };
const curSet = () => sets.find(t=>t.id===cur);
function renderSets(){
  const box=$('sets'); box.innerHTML='';
  sets.forEach(t=>{ const b=document.createElement('button'); b.type='button'; b.className='set'+(t.id===cur?' on':'');
    b.style.backgroundImage=`url(${t.bg})`; b.innerHTML=`<b style="background:${t.edge}"></b><span class="del">×</span>`;
    b.onclick=e=>{ if (e.target.classList.contains('del')){ if(confirm('このセットを削除しますか？')){ sets=sets.filter(x=>x!==t); saveSets(); if(cur===t.id) selectSet(sets[0]?.id); else renderSets(); } return; } selectSet(t.id); };
    box.appendChild(b); });
}
function selectSet(id){
  cur=id; store.set('curSet',id||''); const t=curSet(); renderSets();
  if (!t){ bgImg=null; currentList=[]; renderSwatches([]); draw(); return; }
  const i=new Image(); i.onload=()=>{ bgImg=i; currentList=edgeCandidates(analyzeBg(i)); $('edgeColor').value=t.edge; renderSwatches(currentList); draw(); }; i.src=t.bg;
}
$('bg').addEventListener('change',()=>{ const f=$('bg').files[0]; if(!f) return; $('bg').value='';
  fromFile(f,i=>{
    const k=Math.min(1,S/Math.min(i.width,i.height)), c=document.createElement('canvas');
    c.width=Math.round(i.width*k); c.height=Math.round(i.height*k); c.getContext('2d').drawImage(i,0,0,c.width,c.height);
    const t={id:String(Date.now()), bg:c.toDataURL('image/jpeg',0.9), edge:edgeCandidates(analyzeBg(i))[0].hex};
    sets.push(t); saveSets(); selectSet(t.id);
  });
});
document.addEventListener('paste',e=>{ const f=[...e.clipboardData.files].find(f=>f.type.startsWith('image/')); if(f) fromFile(f,i=>shotImg=i); });
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{ e.preventDefault(); const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/')); if(f) fromFile(f,i=>shotImg=i); });

// ---- フチ色のおすすめ ----
// 背景の主な色相・明るさを調べ、配色理論（類似色／補色／三角配色）でネオン色の候補を作る。
// 「おすすめ」は類似色を寒色側へ約35°ずらした色：同系色でなじみつつ、色相差と高彩度で背景から浮き上がる。
// 背景が暗いときは明るく、明るいときは少し濃くして明度差もつける。
function analyzeBg(img){
  const c=document.createElement('canvas'); c.width=c.height=48;
  const g=c.getContext('2d'); g.drawImage(img,0,0,48,48);
  const d=g.getImageData(0,0,48,48).data; let x=0,y=0,L=0,n=0;
  for (let i=0;i<d.length;i+=4){
    const [h,s,l]=hsl(d[i],d[i+1],d[i+2]); const w=s*(1-Math.abs(2*l-1));
    x+=Math.cos(h*2*Math.PI)*w; y+=Math.sin(h*2*Math.PI)*w; L+=l; n++;
  }
  return { hue:((Math.atan2(y,x)*180/Math.PI)+360)%360, light:L/n };
}
function hsl2hex(h,s,l){ h=((h%360)+360)%360; s/=100; l/=100;
  const f=n=>{ const k=(n+h/30)%12, a=s*Math.min(l,1-l); return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0'); };
  return '#'+f(0)+f(8)+f(4); }
function edgeCandidates(bg){
  const l = bg.light<0.35 ? 72 : bg.light>0.85 ? 56 : 64;
  return [
    {name:'おすすめ',  hex:hsl2hex(bg.hue-38,80,l)},
    {name:'類似色',    hex:hsl2hex(bg.hue+35,95,l)},
    {name:'補色',      hex:hsl2hex(bg.hue+180,95,l)},
    {name:'三角配色',  hex:hsl2hex(bg.hue+120,95,l)},
    {name:'ホワイト',  hex:'#fff4fc'},
  ];
}
function renderSwatches(list){
  const box=$('swatches'); box.innerHTML='';
  list.forEach(c=>{ const b=document.createElement('button'); b.className='sw'+(c.hex===$('edgeColor').value?' on':''); b.type='button';
    b.innerHTML=`<i style="background:${c.hex};color:${c.hex}"></i>${c.name}`;
    b.onclick=()=>{ $('edgeColor').value=c.hex; saveEdge(); renderSwatches(list); draw(); }; box.appendChild(b); });
}
let currentList=[];
function saveEdge(){ const t=curSet(); if (t){ t.edge=$('edgeColor').value; saveSets(); renderSets(); } }
$('edgeColor').addEventListener('input',()=>{ saveEdge(); renderSwatches(currentList); draw(); });
function hsl(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  if(mx===mn) return [0,0,l]; const d=mx-mn, s=l>.5?d/(2-mx-mn):d/(mx+mn);
  const h = mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); return [h/6,s,l]; }

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function countValue(){
  if ($('manual').checked){ $('count').disabled=false; return $('count').value; }
  $('count').disabled=true; const n=Math.max(0,($('owned').value|0)-1); $('count').value=n; return n;
}

function draw(){
  ctx.clearRect(0,0,S,S);
  if (bgImg){ const k=Math.max(S/bgImg.width,S/bgImg.height), w=bgImg.width*k, h=bgImg.height*k;
    ctx.drawImage(bgImg,(S-w)/2,(S-h)/2,w,h); }
  else { ctx.fillStyle='#ff7aa8'; ctx.fillRect(0,0,S,S); }

  const edge = $('edgeColor').value;
  const {x,y,size} = BOX;

  // アイテム画像（正方形切り抜き・縦横同倍率・ピクセルはそのまま）
  ctx.save(); rr(x,y,size,size,R); ctx.clip();
  ctx.fillStyle='#fff'; ctx.fillRect(x,y,size,size);
  if (shotImg){
    const W=shotImg.width, side=Math.min(W*$('cs').value/100, W), top=W*$('ct').value/100;
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(shotImg,(W-side)/2,top,side,side,x,y,size,size);
  }
  ctx.restore();

  // 蛍光フチ（ネオン管風：外側の光 → 白い芯 → 内側の色線。太さ・丸みは常に同じ。光は画像の上にはかけない）
  const o1 = EDGE_IN/2, o2 = EDGE_IN + EDGE_CORE/2, OUTER = EDGE_IN + EDGE_CORE;
  { // 外側の光（別キャンバスで描いて、画像の上にかかる部分は消す）
    const c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
    g.strokeStyle=edge; g.shadowColor=edge; g.lineWidth=EDGE_CORE; g.shadowBlur=24;
    for (let n=0;n<3;n++){ g.beginPath(); g.roundRect(x-o2,y-o2,size+o2*2,size+o2*2,R+o2); g.stroke(); }
    g.shadowBlur=0; g.globalCompositeOperation='destination-out';
    g.beginPath(); g.roundRect(x-OUTER,y-OUTER,size+OUTER*2,size+OUTER*2,R+OUTER); g.fill();
    ctx.drawImage(c,0,0);
  }
  ctx.save();
  ctx.filter='blur(1px)';
  ctx.lineWidth=EDGE_IN+1; ctx.strokeStyle=edge; rr(x-o1,y-o1,size+o1*2,size+o1*2,R+o1); ctx.stroke();
  ctx.lineWidth=EDGE_CORE; ctx.strokeStyle='#fffaff'; ctx.shadowColor='#fff'; ctx.shadowBlur=6;
  rr(x-o2,y-o2,size+o2*2,size+o2*2,R+o2); ctx.stroke();
  ctx.restore();

  // ×数字（ぷっくり濃ピンク＋太い白フチ＋外側のマゼンタの光）。×は数字より小さめ
  if ($('showCount').checked){
    const num=String(countValue());
    const base=FONTS[$('font').value]||FONTS.B;
    const px=parseFloat(base.match(/(\d+)px/)[1]);
    const fNum=base, fX=base.replace(/\d+px/, Math.round(px*0.66)+'px');
    const RIGHT=1194, BASE=262, GAP=18, FAT=16, OUT=36+16, XUP=26, GLOW=edge, SX=1.08;
    const m=document.createElement('canvas').getContext('2d');
    m.font=fNum; const wN=m.measureText(num).width*SX;
    m.font=fX;  const wX=m.measureText('×').width;
    const parts=[{t:num,f:fNum,x:RIGHT-wN,sx:SX},{t:'×',f:fX,x:RIGHT-wN-GAP-wX,sx:1,dy:-XUP}];
    const each=(g,fn)=>parts.forEach(q=>{ g.save(); g.font=q.f; g.textAlign='left'; g.textBaseline='alphabetic'; g.lineJoin='round';
      g.translate(q.x,BASE+(q.dy||0)); g.scale(q.sx,1); fn(g,q.t); g.restore(); });
    // 光と白フチ
    ctx.save(); ctx.shadowColor=GLOW; ctx.shadowBlur=34;
    for (let n=0;n<3;n++) each(ctx,(g,t)=>{ g.shadowColor=GLOW; g.shadowBlur=34; g.strokeStyle='#fff'; g.lineWidth=OUT; g.strokeText(t,0,0); });
    each(ctx,(g,t)=>{ g.strokeStyle='#fff'; g.lineWidth=OUT; g.strokeText(t,0,0); });
    ctx.restore();
    // 文字本体（ぷっくり感）
    const c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
    each(g,(g,t)=>{ g.fillStyle=g.strokeStyle='#f82da1'; g.lineWidth=FAT; g.fillText(t,0,0); g.strokeText(t,0,0); }); // 太らせる
    g.globalCompositeOperation='source-atop';
    each(g,(g,t)=>{ g.strokeStyle='#d0409a'; g.lineWidth=FAT+10; g.filter='blur(4px)'; g.strokeText(t,0,0); });       // ふち側を少し濃く
    each(g,(g,t)=>{ g.fillStyle='#f82da1'; g.filter='blur(6px)'; g.fillText(t,0,-2); });                           // 中はベタ
    each(g,(g,t)=>{ g.fillStyle='rgba(255,150,215,.3)'; g.filter='blur(14px)'; g.fillText(t,-10,-18); g.filter='none'; }); // 左上のハイライト
    const mk=document.createElement('canvas'); mk.width=mk.height=S;
    each(mk.getContext('2d'),(g,t)=>{ g.fillStyle=g.strokeStyle='#000'; g.lineWidth=FAT; g.fillText(t,0,0); g.strokeText(t,0,0); });
    g.globalCompositeOperation='destination-in'; g.filter='none'; g.drawImage(mk,0,0);
    ctx.drawImage(c,0,0);
  } else countValue();
}
selectSet(cur || sets[0]?.id);
$('dl').onclick=()=>{ const a=document.createElement('a'); a.download='item-promo-'+Date.now()+'.png'; a.href=cv.toDataURL('image/png'); a.click(); };
draw();
Promise.all(Object.values(FONTS).map(f=>document.fonts.load(f,"×0123456789").catch(()=>{}))).then(draw);
</script>
</body>
</html>
